spring.application.name=peopleflow

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.write-dates-as-timestamps=false

app.seed-data=${SEED_DATA:true}

server.error.include-stacktrace=never

# Browser login session (local HTTP development; set COOKIE_SECURE=true behind HTTPS).
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
app.bootstrap.name=${ADMIN_NAME:Administrator}


